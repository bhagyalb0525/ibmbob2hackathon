<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REGEN — AI-Powered Incident Recovery</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/shopflow/shopflow.css" />
</head>
<body>
  <div id="app" class="app-shell">

    <!-- ================= Global header (spans both panels) ================= -->
    <header class="app-header">
      <div class="app-header__brand">
        <svg class="shield-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2.4 4.6 5.3v6.1c0 4.6 3.1 8.6 7.4 10 4.3-1.4 7.4-5.4 7.4-10V5.3L12 2.4Z"
                fill="currentColor" opacity="0.18" />
          <path d="M12 2.4 4.6 5.3v6.1c0 4.6 3.1 8.6 7.4 10 4.3-1.4 7.4-5.4 7.4-10V5.3L12 2.4Z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="m8.7 11.9 2.3 2.3 4.4-4.6" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="app-header__name">REGEN</span>
        <span class="app-header__tagline">AI-Powered Incident Recovery</span>
      </div>

      <div class="app-header__meta">
        <span id="connection-badge" class="badge badge--connecting">Connecting…</span>
        <span class="meta-divider" aria-hidden="true">|</span>
        <span class="env-chip">Demo Environment</span>
      </div>
    </header>

    <!-- ===================== Two-panel body (no tabs) ===================== -->
    <main class="split">

      <!-- ---------- LEFT PANEL: ShopFlow (fake production app) ---------- -->
      <section class="panel panel--shopflow" id="panel-shopflow" aria-label="ShopFlow storefront">
        <div class="panel-head panel-head--light">
          <h2 class="panel-title">ShopFlow</h2>
          <p class="panel-subtitle panel-subtitle--light">Ecommerce storefront</p>
        </div>
        <div id="mount-shopflow" class="shopflow-mount"></div>
      </section>

      <div class="split-divider" role="separator" aria-orientation="vertical"></div>

      <!-- ---------- RIGHT PANEL: REGEN (existing dashboard) ---------- -->
      <section class="panel panel--regen" id="panel-regen" aria-label="REGEN incident response dashboard">
        <div class="panel-head">
          <h2 class="panel-title">REGEN</h2>
          <p class="panel-subtitle">Autonomous Incident Response</p>
        </div>

        <div class="regen-controls controls">
          <button id="btn-trigger-full" class="btn btn--primary">▶ Run Full Pipeline</button>
          <button id="btn-trigger-immune" class="btn btn--immune">⚡ Trigger Immune Match</button>
          <button id="btn-reset" class="btn btn--danger">↺ Reset</button>
        </div>

        <div class="regen-scroll">

          <section class="panel-section">
            <h3 class="panel-section__title">Incident Details</h3>
            <div id="mount-incident-detail"></div>
          </section>

          <section class="panel-section">
            <h3 class="panel-section__title">Similar Incidents</h3>
            <div id="mount-immune-stats"></div>
          </section>

          <section class="panel-section">
            <h3 class="panel-section__title">AI Agent Pipeline</h3>
            <div id="mount-pipeline-tracker"></div>
          </section>

          <section class="panel-section">
            <h3 class="panel-section__title">Logs</h3>
            <div class="card">
              <div id="activity-feed" class="activity-feed"></div>
            </div>
          </section>

        </div>
      </section>

    </main>
  </div>

  <!-- Component scripts (vanilla ES modules) -->
  <script type="module" src="/src/components/IncidentDetail.js"></script>
  <script type="module" src="/src/components/ImmuneMemoryStats.js"></script>
  <script type="module" src="/src/components/PipelineTracker.js"></script>
  <!-- ShopFlow storefront -->
  <script type="module" src="/src/shopflow/ShopFlow.js"></script>
  <!-- Main SSE client -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
